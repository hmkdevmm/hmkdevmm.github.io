<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f6bff"/>
      <stop offset="100%" stop-color="#4d3bd6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- squircle base -->
  <rect x="8" y="8" width="240" height="240" rx="64" fill="url(#g)"/>
  <rect x="8" y="8" width="240" height="120" rx="64" fill="url(#glass)"/>
  <!-- monogram: stylized H / M formed from two bars + node, doubles as app-window motif -->
  <g fill="#ffffff">
    <rect x="68" y="66" width="26" height="124" rx="10"/>
    <rect x="162" y="66" width="26" height="124" rx="10"/>
    <rect x="68" y="115" width="120" height="26" rx="10"/>
  </g>
  <!-- accent dot: "app" node -->
  <circle cx="188" cy="80" r="15" fill="#ffde59"/>
</svg>
